<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VolcanX | Free Cyber Hub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Tajawal:wght@500;700;900&display=swap');

        :root {
            --neon-green: #00ff66;
            --neon-blue: #00f0ff;
            --neon-magenta: #ff0055;
            --bg-dark: #090d16;
            --panel-bg: #0f1524;
            --panel-border: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Orbitron', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #babcda;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ⏳ شاشة التحميل النيون */
        #loader-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #05070b;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .spinner-neon {
            width: 80px; height: 80px;
            border: 4px solid rgba(0, 240, 255, 0.1);
            border-top: 4px solid var(--neon-blue);
            border-right: 4px solid var(--neon-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .load-text {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 🌋 الهيدر */
        header {
            background: linear-gradient(180deg, #0f1424 0%, #080b14 100%);
            border-bottom: 2px solid var(--panel-border);
            padding: 15px 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0; z-index: 1000;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 12px;
            transform: perspective(500px) rotateX(2deg);
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
        }
        .brand-name span { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }

        .header-utility {
            display: flex;
            gap: 8px;
        }
        .util-btn {
            background-color: #151d30;
            border: 1px solid var(--panel-border);
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .util-btn:hover {
            color: #fff;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .util-btn.active-lang {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* 🏰 الحاوية الرئيسية */
        .main-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .intro-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .main-title {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .main-title::before {
            content: '';
            display: inline-block;
            width: 6px; height: 26px;
            background-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            border-radius: 4px;
        }
        .api-credit {
            color: #00ff66;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,255,102,0.2);
        }

        /* لوحة الفلاتر والبحث */
        .control-bar {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
        }

        .sort-group {
            display: flex;
            background-color: #080b14;
            border: 1px solid var(--panel-border);
            padding: 4px;
            border-radius: 6px;
        }
        .sort-btn {
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .sort-btn.active {
            background-color: #1e293b;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .search-box {
            flex-grow: 1;
            background-color: #080b14;
            border: 1px solid var(--panel-border);
            padding: 12px 18px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .btn-refresh {
            background-color: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 0 5px var(--neon-green);
            transition: all 0.2s;
        }
        .btn-refresh:hover {
            box-shadow: 0 0 15px var(--neon-green);
            transform: scale(1.02);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--panel-border);
            padding-top: 14px;
        }
        .platform-tag {
            background-color: #141c2f;
            border: 1px solid var(--panel-border);
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .platform-tag.active {
            background-color: var(--neon-blue);
            color: #000;
            font-weight: bold;
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px var(--neon-blue);
        }

        /* 🎴 كروت الألعاب */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .game-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transform: perspective(1000px);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .game-card:hover {
            transform: perspective(1000px) translateY(-5px) rotateX(1deg);
            border-color: var(--neon-green);
            box-shadow: 0 10px 25px rgba(0, 255, 102, 0.2);
        }

        .card-thumbnail {
            position: relative;
            width: 100%; height: 170px;
            background-color: #080b14;
        }
        .card-thumbnail img { width: 100%; height: 100%; object-fit: cover
